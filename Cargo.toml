[package]
name = "claude-code"
version = "2.1.888"
edition = "2024"
description = "Claude Code CLI - Rust rewrite"
license = "MIT"

[[bin]]
name = "claude"
path = "src/main.rs"

[features]
default = ["bridge-mode", "daemon"]
bridge-mode = []
daemon = []
acp = []
voice-mode = []
computer-use = []
bg-sessions = []
ssh-remote = []

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
strum = { version = "0.26", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
globset = "0.4"
walkdir = "2"
similar = "2"
tempfile = "3"
directories = "5"
dirs = "6"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1"
rstest = "0.23"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
